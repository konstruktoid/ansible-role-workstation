---
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    # Wait for a release to have been public long enough that a malicious or
    # broken version would have been noticed before it is proposed here.
    cooldown:
      default-days: 7
    groups:
      # Keep codeql in one pull request so they move together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
