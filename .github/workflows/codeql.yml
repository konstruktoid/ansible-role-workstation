---
name: CodeQL

# This repository is Ansible YAML plus GitHub Actions workflows, so `actions` is
# the only CodeQL language that applies. It also satisfies the Scorecard SAST
# check, which looks for `github/codeql-action` in a workflow.
on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze GitHub Actions workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      security-events: write # Needed to upload the results to code scanning.
      contents: read # Needed to check out the workflows being analysed.
      actions: read # Needed to read the workflow metadata CodeQL analyses.

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:actions"
