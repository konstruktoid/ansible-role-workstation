---
name: CodeQL

# This repository is Ansible YAML plus GitHub Actions workflows, so `actions` is
# the only CodeQL language that applies. It also satisfies the Scorecard SAST
# check, which looks for `github/codeql-action` in a workflow.
on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze GitHub Actions workflows
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      security-events: write # Needed to upload the results to code scanning.
      contents: read # Needed to check out the workflows being analysed.
      actions: read # Needed to read the workflow metadata CodeQL analyses.

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1ba80a13dd99fba24a470575428917156a28b43 # v4.37.5
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:actions"
