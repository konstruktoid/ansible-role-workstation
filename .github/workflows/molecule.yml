---
name: Molecule testing workflow

on:
  pull_request:
  push:
  schedule:
    - cron: "30 5 * * */3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tox-docker:
    name: Molecule (stable releases)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read # Needed to check out the role under test.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install tox
        run: |
          set -euo pipefail
          uv tool install tox --with tox-uv

      - name: Test stable releases
        run: |
          set -euo pipefail
          tox run -e docker

  tox-docker-upstream:
    name: Molecule (upstream code)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read # Needed to check out the role under test.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install tox
        run: |
          set -euo pipefail
          uv tool install tox --with tox-uv

      - name: Test upstream code
        run: |
          set -euo pipefail
          tox run -e docker-upstream
