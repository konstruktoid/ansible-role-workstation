---
name: Molecule testing workflow

on:
  pull_request:
  push:
  schedule:
    - cron: "30 5 * * */3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tox-docker:
    name: Molecule (stable releases)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read # Needed to check out the role under test.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install tox
        run: |
          set -euo pipefail
          uv tool install tox --with tox-uv

      - name: Test stable releases
        run: |
          set -euo pipefail
          tox run -e docker

  tox-docker-upstream:
    name: Molecule (upstream code)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read # Needed to check out the role under test.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0

      - name: Install tox
        run: |
          set -euo pipefail
          uv tool install tox --with tox-uv

      - name: Test upstream code
        run: |
          set -euo pipefail
          tox run -e docker-upstream
