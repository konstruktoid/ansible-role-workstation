---
name: Scorecards supply-chain security

# Note: the `push` trigger was removed deliberately. Scorecard only supports the
# default branch, every run so far logged `Publication enabled: false`, and a
# single analysis of this repository takes ~3h because the checks resolve the
# pip requirements files. Running it per push to main bought nothing and cost
# hours of runner time. The weekly schedule is what refreshes the code scanning
# alerts.
on:
  # Only the default branch is supported.
  branch_protection_rule:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecards analysis
    runs-on: ubuntu-26.04
    # The analysis stalls for ~3h resolving the Python dependencies declared in
    # requirements-dev.txt and requirements-upstream.txt. 20m was not enough and
    # cancelled every run; see the harden-runner egress audit of run 30151272286.
    timeout-minutes: 360
    permissions:
      security-events: write # Needed to upload the results to code scanning.
      id-token: write # Used to receive a Scorecard badge.
      contents: read # Needed to check out the repository.
      actions: read # Needed to read the workflow metadata Scorecard analyses.

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # (Optional) Read-only PAT token. Uncomment the `repo_token` line
          # below if:
          # - you want to enable the Branch-Protection check on a *public*
          #   repository, or
          # - you are installing Scorecards on a *private* repository
          # To create the PAT, follow the steps in
          # https://github.com/ossf/scorecard-action#authentication-with-pat.
          # repo_token: ${{ secrets.SCORECARD_READ_TOKEN }}

          # Publish the results for public repositories to enable scorecard
          # badges. For more details, see
          # https://github.com/ossf/scorecard-action#publishing-results.
          # For private repositories, `publish_results` will automatically be
          # set to `false`, regardless of the value entered here.
          publish_results: true

      # Upload the results as artifacts (optional). Commenting out will disable
      # uploads of run results in SARIF format to the repository Actions tab.
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      # Upload the results to GitHub's code scanning dashboard.
      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
