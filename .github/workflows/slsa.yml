---
name: SLSA

on:
  push:
  release:
    types: [published, released]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and hash role content
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read # Needed to check out the role content that is hashed.
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Resolve the repository name
        shell: bash
        run: |
          set -euo pipefail
          echo "REPOSITORY_NAME=${GITHUB_REPOSITORY##*/}" >> "${GITHUB_ENV}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only the role content directories that actually exist are hashed, since
      # this role currently has no handlers/ or templates/ directory. The output
      # is sorted by path so the digest does not depend on traversal order.
      - name: Build artifacts
        shell: bash
        run: |
          set -euo pipefail
          role_dirs=()
          for role_dir in defaults handlers meta tasks templates; do
            if [ -d "${role_dir}" ]; then
              role_dirs+=("${role_dir}")
            fi
          done
          if [ "${#role_dirs[@]}" -eq 0 ]; then
            echo "No role content directories found to hash" >&2
            exit 1
          fi
          find "${role_dirs[@]}" -type f -exec sha256sum {} + \
            | sort -k 2 > "${REPOSITORY_NAME}.sha256"

      - name: Generate hashes
        shell: bash
        id: hash
        run: |
          set -euo pipefail
          echo "hashes=$(sha256sum "${REPOSITORY_NAME}.sha256" | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Upload ${{ env.REPOSITORY_NAME }}.sha256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.REPOSITORY_NAME }}.sha256
          path: ${{ env.REPOSITORY_NAME }}.sha256
          if-no-files-found: error
          retention-days: 5

  provenance:
    needs: [build]
    permissions:
      actions: read # Needed to read the run metadata being attested to.
      id-token: write # Needed to mint the OIDC token signing the provenance.
      contents: write # Needed to attach the provenance to the release.
    # Deliberately referenced by `@vX.Y.Z` and not by commit SHA. The generator
    # MUST be referenced by tag so slsa-verifier can verify the ref of the
    # trusted builder's reusable workflow, and a shorter tag such as `@v2` fails
    # the build. See the slsa-github-generator README. zizmor's `unpinned-uses`
    # finding for this line is suppressed in zizmor.yml for the same reason.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: ${{ startsWith(github.ref, 'refs/tags/') }}

  release:
    name: Attach checksum to release
    permissions:
      actions: read # Needed to download the build job's artifact.
      id-token: write # Needed to mint the OIDC token for publishing.
      contents: write # Needed to upload the checksum to the release.
    needs: [build, provenance]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Resolve the repository name
        shell: bash
        run: |
          set -euo pipefail
          echo "REPOSITORY_NAME=${GITHUB_REPOSITORY##*/}" >> "${GITHUB_ENV}"

      - name: Download ${{ env.REPOSITORY_NAME }}.sha256
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.REPOSITORY_NAME }}.sha256

      - name: Upload asset
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ${{ env.REPOSITORY_NAME }}.sha256
