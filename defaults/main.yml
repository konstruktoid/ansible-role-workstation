    x86_64: "aab924fd522efd06f1c5f3b93a243864fc453132c94b2dc49f1371b528a4b967"
  workstation_opencode_release:
    arm64: "dcb1b5ec5687b43f87749560021f9203f3809e0ce5ae44ff9be8ae17083fe4ba"
    x64: "0cddc222418b8553669905a8980c0cda7088f00da24d83d6ac76b01c9fdb2aaf"
  workstation_gh_release:
    amd64: "a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112"
