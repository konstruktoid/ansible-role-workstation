---
- name: Install workstation packages
  ansible.builtin.import_tasks:
    file: packages.yml
  tags:
    - packages

- name: Install Docker Engine
  ansible.builtin.import_tasks:
    file: docker.yml
  when:
    - workstation_docker_install | bool
  tags:
    - docker

- name: Install uv
  ansible.builtin.import_tasks:
    file: uv.yml
  become: false
  when:
    - workstation_uv_install | bool
  tags:
    - uv

- name: Configure npm and install Claude Code
  ansible.builtin.import_tasks:
    file: npm.yml
  become: false
  when:
    - workstation_claude_code_install | bool
  tags:
    - npm
    - claude_code

- name: Install tox
  ansible.builtin.import_tasks:
    file: tox.yml
  become: false
  when:
    - workstation_tox_install | bool
  tags:
    - tox

- name: Install opencode
  ansible.builtin.import_tasks:
    file: opencode.yml
  become: false
  when:
    - workstation_opencode_install | bool
  tags:
    - opencode

# Imported with become: false like the other user-scoped tool installs. The
# removal of the system-wide gh install is the only elevating part of the file,
# and sets become: true on its own block.
- name: Install GitHub CLI
  ansible.builtin.import_tasks:
    file: github_cli.yml
  become: false
  when:
    - workstation_gh_install | bool
  tags:
    - github_cli

- name: Install copilot.vim
  ansible.builtin.import_tasks:
    file: copilot_vim.yml
  become: false
  when:
    - workstation_copilot_vim_install | bool
  tags:
    - copilot_vim

- name: Apply workstation hardening
  ansible.builtin.import_tasks:
    file: hardening.yml
  tags:
    - hardening

# Last, so the clients are verified in the state the machine is actually left
# in, after hardening has been applied.
- name: Verify the installed command-line clients
  ansible.builtin.import_tasks:
    file: verify.yml
  become: false
  tags:
    - verify
