---
- name: Apply workstation hardening
  ansible.builtin.import_tasks:
    file: hardening.yml
  tags:
    - hardening

- name: Install workstation packages
  ansible.builtin.import_tasks:
    file: packages.yml
  tags:
    - packages

- name: Install Docker Engine
  ansible.builtin.import_tasks:
    file: docker.yml
  when:
    - workstation_docker_install | bool
  tags:
    - docker

# uv, npm, tox and copilot.vim only write to the connecting user's home
# directory, so they are pinned to become: false. A static import applies the
# keyword to every task it imports, which keeps the privilege boundary in one
# auditable place and stops a play-level become: true in a consuming playbook
# from silently installing these tools as root.
- name: Install uv
  ansible.builtin.import_tasks:
    file: uv.yml
  become: false
  when:
    - workstation_uv_install | bool
  tags:
    - uv

- name: Configure npm and install Claude Code
  ansible.builtin.import_tasks:
    file: npm.yml
  become: false
  when:
    - workstation_claude_code_install | bool
  tags:
    - npm
    - claude_code

- name: Install tox
  ansible.builtin.import_tasks:
    file: tox.yml
  become: false
  when:
    - workstation_tox_install | bool
  tags:
    - tox

- name: Install GitHub CLI
  ansible.builtin.import_tasks:
    file: github_cli.yml
  when:
    - workstation_gh_install | bool
  tags:
    - github_cli

- name: Install copilot.vim
  ansible.builtin.import_tasks:
    file: copilot_vim.yml
  become: false
  when:
    - workstation_copilot_vim_install | bool
  tags:
    - copilot_vim
