---
- name: Prepare
  hosts: molecule
  gather_facts: false
  any_errors_fatal: true
  become: "{{ ansible_user is defined and ansible_user != 'root' }}"
  tasks:
    - name: Install Python 3
      ansible.builtin.raw: >
        DEBIAN_FRONTEND=noninteractive apt-get install --update -y python3 python3-apt || \
        dnf install -y python3 python3-dnf || microdnf install -y python3 python3-dnf
      changed_when: false
      register: workstation_molecule_install_python3
      until: workstation_molecule_install_python3 is success
      retries: 10
      delay: 6

    - name: Install sudo
      ansible.builtin.raw: >
        DEBIAN_FRONTEND=noninteractive apt-get install --update -y sudo || \
        microdnf install -y sudo || dnf install -y sudo
      changed_when: false
      register: workstation_molecule_install_sudo
      until: workstation_molecule_install_sudo is success
      retries: 10
      delay: 6

    - name: Remove the docker-clean apt hook
      ansible.builtin.file:
        path: /etc/apt/apt.conf.d/docker-clean
        state: absent

    - name: Install systemd
      ansible.builtin.apt:
        name: systemd
        state: present
        install_recommends: false
        update_cache: true

    - name: Gather facts
      ansible.builtin.gather_facts:

    - name: Simulate a pre-existing curl-installed Claude Code CLI
      block:
        - name: Create a fake native installer versions directory
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.local/share/claude/versions"
            state: directory
            mode: "0755"

        - name: Create a fake native installer claude binary
          ansible.builtin.copy:
            content: ""
            dest: "{{ ansible_facts.env.HOME }}/.local/share/claude/versions/0.0.0-test"
            mode: "0755"

        - name: Ensure ~/.local/bin exists
          ansible.builtin.file:
            path: "{{ ansible_facts.env.HOME }}/.local/bin"
            state: directory
            mode: "0755"

        - name: Symlink the fake native installer claude binary into ~/.local/bin
          ansible.builtin.file:
            src: "{{ ansible_facts.env.HOME }}/.local/share/claude/versions/0.0.0-test"
            dest: "{{ ansible_facts.env.HOME }}/.local/bin/claude"
            state: link

    # Reproduces the system-wide GitHub CLI install that earlier versions of
    # this role performed, so that converge exercises its removal rather than
    # finding nothing to remove and verify.yml asserting a trivially true
    # outcome.
    - name: Simulate a pre-existing system-wide GitHub CLI install
      block:
        - name: Ensure apt keyrings directory exists
          ansible.builtin.file:
            path: /etc/apt/keyrings
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Add GitHub CLI GPG key
          ansible.builtin.get_url:
            url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
            dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
            owner: root
            group: root
            mode: "0644"

        - name: Add GitHub CLI apt repository
          ansible.builtin.deb822_repository:
            name: github-cli
            types: deb
            uris: https://cli.github.com/packages
            suites: stable
            components: main
            architectures: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts.architecture, ansible_facts.architecture) }}"
            signed_by: /etc/apt/keyrings/githubcli-archive-keyring.gpg
            install_python_debian: true

        - name: Install GitHub CLI package
          ansible.builtin.apt:
            name: gh
            state: present
            install_recommends: false
            update_cache: true
